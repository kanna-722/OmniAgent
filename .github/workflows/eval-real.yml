name: OmniAgent Real Evaluation

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit with compatible environment configuration
        required: true
        default: 284305d
      candidate_ref:
        description: Candidate commit to evaluate
        required: true
        default: e3fc22b

jobs:
  compare-real:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      EVAL_MYSQL_ENDPOINT: ${{ secrets.EVAL_MYSQL_ENDPOINT }}
      EVAL_MYSQL_ASYNC_ENDPOINT: ${{ secrets.EVAL_MYSQL_ASYNC_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: pwsh
        run: |
          $required = @("DEEPSEEK_API_KEY", "SILICONFLOW_API_KEY", "EVAL_MYSQL_ENDPOINT", "EVAL_MYSQL_ASYNC_ENDPOINT")
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret: $name"
            }
          }

      - name: Run isolated real benchmark
        run: >-
          python -m evals.compare
          --baseline-ref "${{ inputs.baseline_ref }}"
          --candidate-ref "${{ inputs.candidate_ref }}"
          --suite all
          --mode real

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniagent-real-evaluation
          path: evals/results/
          if-no-files-found: warn
