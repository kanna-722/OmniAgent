name: OmniAgent Mock Evaluation

on:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run framework unit tests
        run: python -m unittest discover -s evals/tests -v

      - name: Run existing core regression tests
        working-directory: src/backend
        run: >-
          python -m unittest
          agentchat.test.test_memory_context
          agentchat.test.test_memory_config
          agentchat.test.test_agent_execution_config
          agentchat.test.test_rag_retrieval -v

      - name: Resolve comparison refs
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            "EVAL_BASELINE=${{ github.event.pull_request.base.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "EVAL_BASELINE=284305d" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "EVAL_CANDIDATE=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run isolated Mock benchmark
        run: >-
          python -m evals.compare
          --baseline-ref $env:EVAL_BASELINE
          --candidate-ref $env:EVAL_CANDIDATE
          --suite all
          --mode mock

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniagent-mock-evaluation
          path: evals/results/
          if-no-files-found: warn
